<!DOCTYPE html>
<html>
  <head>
    <title>Basic Web Page</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" >
    <link href="styles.css" rel="stylesheet">
    
  </head>
  <body>

    <div class="container">

      <div class="board" id="todo">
        <div class="heading">
          <h3>Todo</h3>
          <button class="add-task">Add</button>
        </div>
      </div>

      <div class="board" id="in_progress">
        <div class="heading">
          <h3>In Progress</h3>
          <button class="add-task">Add</button>
        </div>
      </div>

      <div class="board" id="completed">
        <div class="heading">
          <h3>Completed</h3>
          <button class="add-task">Add</button>
        </div>
        
      </div>


      <div class="add-board">
        <button>+</button>
      </div>
      
    </div>
    
    <script src="./script.js"></script>

  </body>
</html>
